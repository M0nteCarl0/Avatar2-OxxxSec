    <text x="18" y="159" fill="#c9d1d9">[I2C] Command 0xa1 -&gt; sensor returns 26 C</text>
    <text x="18" y="178" fill="#c9d1d9">[I2C] DR read by firmware: 0x1a</text>
    <text x="18" y="197" fill="#c9d1d9">[SPI] CR1 &lt;- 0x00000001 (enabled=True, PC=0x08000016)</text>
