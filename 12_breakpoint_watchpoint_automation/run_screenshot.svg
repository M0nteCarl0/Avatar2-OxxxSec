<svg xmlns="http://www.w3.org/2000/svg" width="613" height="393" viewBox="0 0 613 393" role="img" aria-label="Terminal output of 12_breakpoint_watchpoint_automation">
  <rect width="613" height="393" rx="10" fill="#0d1117"/>
  <rect width="613" height="34" rx="10" fill="#161b22"/>
  <circle cx="18" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="17" r="6" fill="#27c93f"/>
  <text x="80" y="21" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">12_breakpoint_watchpoint_automation</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve">
    <text x="18" y="64" fill="#7ee787">$ python example.py</text>
    <text x="18" y="83" fill="#c9d1d9">[*] Initializing Breakpoint &amp; Watchpoint Automation...</text>
    <text x="18" y="102" fill="#79c0ff">[+] Avatar2 target and memory map ready</text>
    <text x="18" y="121" fill="#79c0ff">[+] Watchpoint variable : 0x20000000</text>
    <text x="18" y="140" fill="#79c0ff">[+] Breakpoint (GPIO)   : 0x0800000e</text>
    <text x="18" y="159" fill="#79c0ff">[+] Loop body entry     : 0x08000004</text>
    <text x="18" y="178" fill="#c9d1d9">[*] Resuming target with breakpoints/watchpoints armed...</text>
    <text x="18" y="197" fill="#c9d1d9">[WATCHPOINT] Write of 1 to 0x20000000 (PC: 0x08000006)</text>
    <text x="18" y="216" fill="#c9d1d9">[WATCHPOINT] Write of 2 to 0x20000000 (PC: 0x08000006)</text>
    <text x="18" y="235" fill="#c9d1d9">[WATCHPOINT] Write of 3 to 0x20000000 (PC: 0x08000006)</text>
    <text x="18" y="254" fill="#c9d1d9">[BREAKPOINT HIT] PC=0x0800000e R0=3 -&gt; halting target</text>
    <text x="18" y="273" fill="#79c0ff">[+] Watchpoint hits     : 3 (values: [1, 2, 3])</text>
    <text x="18" y="292" fill="#79c0ff">[+] Breakpoint hits     : 1</text>
    <text x="18" y="311" fill="#79c0ff">[+] Counter value in RAM: 3</text>
    <text x="18" y="330" fill="#79c0ff">[+] Halted PC           : 0x0800000e</text>
    <text x="18" y="349" fill="#3fb950">[SUCCESS] Breakpoint and watchpoint automation verified on real execution.</text>
    <text x="18" y="368" fill="#7ee787">$</text>
