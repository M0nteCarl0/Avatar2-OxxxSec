    <text x="18" y="254" fill="#c9d1d9">  Stack Base   : 0x20005000</text>
    <text x="18" y="273" fill="#c9d1d9">  DBGMCU_IDCODE: 0x10016414 [STM32F103xx Medium-Density]</text>
